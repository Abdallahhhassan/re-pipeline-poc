<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallets</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --paper: #eef2f1;
      --card: #ffffff;
      --ink: #14302b;
      --muted: #5b6f6a;
      --line: #d3dcda;
      --accent: #0d6b5f;
      --ok: #e3f4ee;
      --wait: #fff4dc;
      --bad: #fdeaea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 12px; padding: 18px 32px; }
    header strong { font-size: 17px; letter-spacing: -0.01em; }
    header span { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 0 8px; }
    main { max-width: 860px; margin: 0 auto; padding: 8px 32px 48px; }
    h1 { font-size: 26px; margin: 4px 0 18px; letter-spacing: -0.02em; }
    a { color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; }
    .wallet { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
    .wallet h2 { margin: 0; font-size: 16px; }
    .wallet .cur { color: var(--muted); font-size: 13px; }
    .wallet .bal { font-size: 22px; font-variant-numeric: tabular-nums; margin: 8px 0 0; }
    .wallet .hold { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .send { display: grid; grid-template-columns: 1fr 240px; gap: 18px; align-items: start; }
    form, aside { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 4px; }
    select, input { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; background: #fff; color: var(--ink); }
    select:focus, input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    aside p { margin: 0 0 6px; }
    aside .big { font-size: 20px; font-variant-numeric: tabular-nums; }
    #message:not(:empty) { margin-top: 16px; padding: 12px 14px; border-radius: 8px; }
    #message.ok { background: var(--ok); }
    #message.wait { background: var(--wait); }
    #message.error { background: var(--bad); }
    @media (max-width: 640px) { .send { grid-template-columns: 1fr; } main, header { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header><strong>Wallets</strong><span>Rebuild</span></header>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
