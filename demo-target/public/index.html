<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallets</title>
<style>
  /* The original app's look: a plain internal tool. */
  body { font: 14px/1.45 Tahoma, Verdana, sans-serif; margin: 0; background: #eceff1; color: #222; }
  header { background: #37474f; color: #fff; padding: 10px 18px; font-weight: bold; }
  main { max-width: 760px; margin: 18px auto; background: #fff; border: 1px solid #c5ccd0; padding: 18px 22px; }
  h1 { font-size: 20px; margin: 4px 0 14px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #c5ccd0; padding: 6px 8px; text-align: left; }
  th { background: #f3f5f6; }
  form { display: grid; grid-template-columns: 90px 260px; gap: 10px 12px; align-items: center; margin: 14px 0; }
  input, select { font: inherit; padding: 4px 6px; }
  button { grid-column: 2; font: inherit; padding: 6px 12px; background: #1565c0; color: #fff; border: 0; cursor: pointer; justify-self: start; }
  button[disabled] { background: #90a4ae; }
  #fee { grid-column: 2; margin: 0; color: #555; }
  #message { min-height: 22px; padding: 8px 10px; }
  #message.ok { background: #e8f5e9; border: 1px solid #a5d6a7; }
  #message.wait { background: #fff8e1; border: 1px solid #ffe082; }
  #message.error { background: #ffebee; border: 1px solid #ef9a9a; }
  #message:empty { display: none; }
</style>
</head>
<body>
<header>Wallet Admin</header>
<main id="view">Loading…</main>
<script src="app.js"></script>
</body>
</html>
